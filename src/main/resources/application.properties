spring.application.name=besthardware

# Configuracao da Base de Dados H2
spring.datasource.url=jdbc:h2:mem:hardware_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Propriedades do Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar o Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracao local de JWT para demonstracao da AV2
app.jwt.secret=besthardware-av2-chave-local-desenvolvimento-precisa-ter-32-bytes
app.jwt.expiration-seconds=3600
